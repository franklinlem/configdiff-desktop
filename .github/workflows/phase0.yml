name: Qualidade e viabilidade
on: [push, pull_request, workflow_dispatch]
jobs:
  viability:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install --require-hashes -r requirements-linux.lock
        if: runner.os == 'Linux'
      - run: python -m pip install -r requirements-windows.txt
        if: runner.os == 'Windows'
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python scripts/fetch_upstream_sources.py
      - run: python scripts/build_candidate.py
      - run: ./dist/ConfigDiff/ConfigDiff --smoke-test
        if: runner.os == 'Linux'
      - run: ./dist/ConfigDiff/ConfigDiff.exe --smoke-test
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ runner.os }}
          path: |
            dist/configdiff-*.tar.gz
            dist/configdiff-*.zip
            dist/configdiff-*.tar
            dist/configdiff-*.sha256
