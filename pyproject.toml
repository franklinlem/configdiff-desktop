[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "configdiff-desktop"
version = "0.1.0rc1"
description = "ConfigDiff Desktop — interface local de comparação"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6-Essentials==6.12.0", "PyYAML==6.0.3"]

[project.scripts]
configdiff = "configdiff.app:main"
configdiff-inspect = "configdiff.inspect:main"
configdiff-compare = "configdiff.compare_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["configdiff.domain.*"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
